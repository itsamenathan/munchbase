[tools]
bun = "1.4.0"
sqlite = "3.53.3"

[tasks.setup]
description = "Install dependencies, migrate the local database, and load test data"
run = [
  "bun -e \"const fs=require('node:fs');const p='.env.local';if(!fs.existsSync(p)){const env=fs.readFileSync('.env.example','utf8').replace('APP_ORIGIN=http://localhost:3000','APP_ORIGIN=http://localhost:3001');fs.writeFileSync(p,env)}\"",
  "bun install --frozen-lockfile",
  "bun run db:migrate",
  "bun run db:seed:test",
]

[tasks.dev]
description = "Start Munchbase in development mode"
run = "bun --bun next dev -H 0.0.0.0 -p 3001"

[tasks.build]
description = "Create a production build"
run = "bun run build"

[tasks.test]
description = "Run the unit tests"
run = "bun test"

[tasks.start]
description = "Serve the production build"
run = "bun run start"

[tasks.check]
description = "Run the required local verification suite"
run = [
  "bunx tsc --noEmit",
  "bun run lint",
  "bun run db:check",
  "bun run test:migrations",
  "bun test",
]

[tasks."docker:build"]
description = "Build the Docker image with the git version stamp"
# .dockerignore keeps .git out of the build context, so the commit has to be
# passed in as a build arg — otherwise the image ships without a version.
run = "MUNCHBASE_COMMIT=$(git rev-parse HEAD) MUNCHBASE_COMMIT_DATE=$(git log -1 --format=%cs) docker compose build"

[tasks."db:integrity"]
description = "Check SQLite integrity and foreign keys without changing the database"
run = "bun run db:integrity"
